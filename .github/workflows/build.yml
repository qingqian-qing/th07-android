name: Build TH07 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK and SDK components
        run: sdkmanager "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK (no game assets)
        run: |
          cd android
          ./gradlew assembleDebug -PTH_EXTERNAL_ASSETS --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: th07-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
